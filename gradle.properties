org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# litert-support:1.4.2 與 litert-support-api:1.4.2 內部共用同一個 namespace，
# 是 Google 尚未修復的已知問題（google-ai-edge/LiteRT#6965），AGP 9 起強制檢查唯一
# namespace 會導致 manifest merger 失敗。官方目前僅給此暫時解法，未來 AGP 版本可能移除此旗標。
android.uniquePackageNames=false
